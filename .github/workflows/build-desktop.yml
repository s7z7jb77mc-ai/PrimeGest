name: Build Desktop (Windows .exe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.1)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Node dependencies
        run: npm ci
        env:
          npm_config_loglevel: verbose

      - name: Show npm log on failure
        if: failure()
        shell: bash
        run: |
          LOG=$(ls C:/npm/cache/_logs/*.log 2>/dev/null | tail -1)
          [ -f "$LOG" ] && cat "$LOG" || echo "Log introuvable"

      - name: Build Vue/Vite frontend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Set version tag
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri — Windows .exe
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'PrimeGest ${{ steps.version.outputs.tag }}'
          releaseBody: |
            ## PrimeGest pour Windows

            Installateur Windows (NSIS) — application de gestion commerciale.

            ### Installation
            1. Télécharger `PrimeGest_*_x64-setup.exe`
            2. Lancer l'installateur et suivre les étapes
            3. Au premier lancement, une connexion internet est requise

            ### Notes
            - L'application se connecte à primegest.app
            - Données locales dans `%APPDATA%\app.primegest.desktop`
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeGest-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn
