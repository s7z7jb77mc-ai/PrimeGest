name: Build Desktop (Windows .exe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.1)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows NSIS Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install Node dependencies
        run: npm ci

      # Vite sur Windows cherche ziggy depuis le chemin PHP vendor (inexistant sur CI).
      # On copie le package npm à cet emplacement pour que le fichier existe physiquement.
      - name: Créer vendor/tightenco/ziggy (compatibilité Windows)
        shell: bash
        run: |
          mkdir -p vendor/tightenco
          cp -r node_modules/ziggy-js vendor/tightenco/ziggy

      # laravel-vite-plugin a besoin d'APP_URL pour le build
      - name: Créer .env pour Vite
        shell: bash
        run: |
          echo "APP_URL=https://primegest.app" > .env
          echo "VITE_APP_URL=https://primegest.app" >> .env

      - name: Déterminer le tag de version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri — Windows .exe
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: https://primegest.app
          VITE_APP_URL: https://primegest.app
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'PrimeGest ${{ steps.version.outputs.tag }}'
          releaseBody: |
            ## PrimeGest pour Windows

            Installateur Windows (NSIS) — application de gestion commerciale pour PME.

            ### Installation
            1. Télécharger `PrimeGest_*_x64-setup.exe`
            2. Lancer l'installateur et suivre les étapes
            3. Une connexion internet est requise pour utiliser l'application

            ### Notes
            - L'application se connecte à primegest.app
            - Données locales dans `%APPDATA%\app.primegest.desktop`
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      - name: Upload .exe (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PrimeGest-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn
